name: collect
# 매일 가격 수집 → 이전 승인 스냅샷과 비교 → 변화가 있으면 검토 PR을 올리고 멈춘다(CLAUDE.md 규칙 14).
# 매일 00:17 UTC에 돌고, 수동 실행도 된다. 검토 PR을 머지하면 publish 워크플로가 게시한다.
on:
  workflow_dispatch:
    inputs:
      simulate:
        description: "검증용 가짜 변동(Redshift 미국 RPU +5%). 이 PR은 머지하지 말고 닫는다"
        type: boolean
        default: false
  schedule:
    - cron: "17 0 * * *"   # 00:17 UTC = 09:17 KST, 정각 혼잡 회피 (게시 워크플로 준비 후 활성화, D3)

permissions:
  contents: write
  issues: write          # revise-copy 라벨 준비, 열린 재작성 요청 조회(Task 7)
  pull-requests: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      SIMULATE: ${{ inputs.simulate && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: install Korean fonts
        # 카드 굽기에 필요하다. 이 서버에는 한글 글꼴이 없고, 없으면 실패하지 않고 두부 글자 카드가 만들어진다.
        # pytest의 실제 굽기 테스트와 1단계보다 먼저 둔다.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=ko family | sort -u
      - run: python -m pytest -q
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: run
        run: python pipeline.py $([ "$SIMULATE" = "true" ] && echo --simulate)
      - name: record daily check on main
        if: env.SIMULATE != 'true'
        run: |
          git add data/checks.csv
          git diff --cached --quiet || git commit -m "chore: price check ${{ steps.run.outputs.day }} (${{ steps.run.outputs.status }})"
          git push origin HEAD:main
      - name: close stale review PR when prices match the approved snapshot
        if: steps.run.outputs.status == 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view review/pending --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr close review/pending --delete-branch --comment "가격이 승인 스냅샷과 같아져 검토할 것이 없다."
          fi
      - name: open or update review PR
        if: steps.run.outputs.status != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.run.outputs.day }}
        run: |
          BRANCH=review/pending
          TITLE="가격 검토 $DAY"
          if [ "$SIMULATE" = "true" ]; then BRANCH=review/simulated; TITLE="[시뮬레이션·머지 금지] $TITLE"; fi
          git switch -c "$BRANCH"
          git add "data/raw/$DAY"
          # 문구 반려 중인 PR이면 보류를 유지한다. 강제 push로 copy-hold.txt가 사라지면 머지 때 승인·게시가 진행된다(Task 7).
          LABELS=$(gh pr view "$BRANCH" --json state,labels -q 'select(.state == "OPEN") | .labels[].name' 2>/dev/null || true)
          if printf '%s\n' "$LABELS" | grep -qx revise-copy; then
            gh issue list --label copy-revision --state open --json url -q '.[].url' | head -n 1 > "data/raw/$DAY/copy-hold.txt"
            git add "data/raw/$DAY/copy-hold.txt"
          fi
          git commit -m "review: price snapshot $DAY"
          git push --force origin "$BRANCH"
          # 본문: 검토 보고서 + 글 초안 + 카드 미리보기 + 게시문. 이미지 주소는 방금 push한 커밋 SHA로 고정한다
          # (같은 날 다시 돌면 브랜치를 강제 push하므로 브랜치 이름으로 걸면 이전 카드가 보일 수 있다).
          SHA=$(git rev-parse HEAD)
          BODY="$RUNNER_TEMP/body.md"
          python -m publish.review_pr --day "$DAY" --repo "$GITHUB_REPOSITORY" --sha "$SHA" > "$BODY"
          gh label create revise-copy --color FBCA04 || true      # 검토자가 문구 반려에 쓰는 라벨(revise.yml)
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
          fi
