name: probe-browser
# Phase 3 Task 1 실측용 임시 워크플로다. CI 서버에 브라우저와 한글 글꼴이 있는지 확인한다.
# 확인이 끝나면 이 파일을 지운다. 수동 실행만 하고 스케줄은 없다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: what is installed
        run: |
          for exe in google-chrome chromium chromium-browser; do
            command -v "$exe" && "$exe" --version || echo "$exe 없음"
          done
          echo "--- 한글 글꼴 ---"
          fc-list :lang=ko | wc -l
          fc-list :lang=ko | head -5

      - name: make the probe page
        run: |
          mkdir -p probe
          cat > probe/card.html <<'HTML'
          <!doctype html><html lang="ko"><meta charset="utf-8"><style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Malgun Gothic","Noto Sans CJK KR",sans-serif}
          .card{width:1080px;height:1350px;background:#F6F5F3;color:#111;padding:60px 56px;position:relative}
          .top{display:flex;justify-content:space-between;font-size:22px;font-weight:700;letter-spacing:.14em}
          h1{font-size:104px;font-weight:800;line-height:1.06;letter-spacing:-.02em;margin-top:240px}
          em{font-style:normal;background:linear-gradient(180deg,#FBBF6B,#F9A14A 45%,#F4645A);
             -webkit-background-clip:text;background-clip:text;color:transparent}
          p{font-size:34px;color:#6E6E73;margin-top:28px;line-height:1.45}
          .bar{width:22px;height:240px;background:#EDF2FE;border-radius:999px;margin-top:48px;
               display:flex;flex-direction:column;justify-content:flex-end}
          .bar i{display:block;height:60%;background:#2F6BF6;border-radius:999px}
          .bottom{position:absolute;left:56px;right:56px;bottom:60px;border:2px solid #F3C9BC;
                  border-radius:999px;height:96px;display:flex;align-items:center;
                  justify-content:space-between;padding:0 40px;font-size:22px;font-weight:700}
          @page{size:1080px 1350px;margin:0}
          </style><div class="card">
          <div class="top"><span>CONSUMPTION INSIGHTS</span><span>가격 변동 리포트</span></div>
          <h1>월 비용<br><em>순위가 바뀌었습니다</em></h1>
          <p>네 플랫폼은 단위가 저마다 달라 단가만으로는 비교되지 않습니다. 같은 워크로드를 기준으로 환산했습니다.</p>
          <div class="bar"><i></i></div>
          <div class="bottom"><span>eugeejo-ui.github.io/consumption-insights</span><span>넘기기 / →</span></div>
          </div></html>
          HTML
          cat > probe/bake.py <<'PY'
          import struct, sys
          from pathlib import Path
          from publish import browser
          tag = sys.argv[1]
          png = browser.screenshot(Path("probe/card.html"), Path(f"probe/card-{tag}.png"))
          pdf = browser.print_pdf(Path("probe/card.html"), Path(f"probe/card-{tag}.pdf"))
          print(tag, struct.unpack(">II", png.read_bytes()[16:24]), f"{png.stat().st_size/1024:.0f}KB",
                f"pdf {pdf.stat().st_size/1024:.0f}KB", browser.find_browser())
          PY

      - name: bake before installing fonts
        run: python probe/bake.py before

      - name: install Korean fonts and bake again
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=ko | wc -l
          python probe/bake.py after

      - run: python -m pytest tests/test_browser.py -q

      - uses: actions/upload-artifact@v7
        with:
          name: probe-cards
          path: probe/*.p*
