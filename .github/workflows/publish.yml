name: publish
# 사람이 검토 PR을 머지하면(= 컨펌) 승인 기록을 남기고, 대시보드를 GitHub Pages에 올린다.
# 시트 적재는 Secret(GOOGLE_SA_KEY, PRICE_SHEET_ID)이 등록된 뒤에만 실행된다(2-0c).
on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "data/manual/**"
      - "data/cards/**"      # 소개 카드(D21)
      - "templates/**"
      - "publish/**"
      - "model/**"
      - "pipeline.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# 기본은 읽기만. 작업마다 필요한 권한만 준다. 특히 OIDC(id-token)는 pip 설치·테스트가 도는 build 작업에 주지 않는다(보안 점검 2026-09-15).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # 승인 기록 커밋을 main에 push한다
    env:
      PYTHONIOENCODING: utf-8
    outputs:
      day: ${{ steps.site.outputs.day }}
      confirmed: ${{ steps.record.outputs.confirmed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: record
        name: record approval for merged snapshots
        # 이번 실행에서 새로 승인한 날짜를 단계 출력(confirmed)으로 낸다. 시트 적재는 이 날짜에만 한다(3-9).
        run: |
          confirmed=""
          for dir in data/raw/*/; do
            day=$(basename "$dir")
            if [ -f "$dir/review.md" ] && [ ! -f "$dir/approved.txt" ]; then
              echo "confirming $day"
              # 시뮬레이션 스냅샷과 문구 재작성 중(copy-hold.txt)인 스냅샷은 파이프라인이 거부한다. 그때는 건너뛰고 게시는 계속한다.
              if python pipeline.py --confirm "$day"; then
                confirmed="$confirmed $day"
              else
                echo "::warning::$day 스냅샷은 반영하지 않았다(시뮬레이션이거나, 문구 재작성 중이거나, 검토 자료가 불완전하다)."
              fi
            fi
          done
          echo "confirmed=${confirmed# }" >> "$GITHUB_OUTPUT"
          git add data/raw
          if ! git diff --cached --quiet; then
            git commit -m "chore: record approval for merged snapshots"
            git push origin HEAD:main
          fi
      - id: site
        name: build the dashboard
        # 승인일(day)은 pipeline.py가 단계 출력에 직접 쓴다. 출력 문장을 파싱하던 방식은 문장이 바뀌자 조용히 깨졌다.
        run: python pipeline.py --build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:             # actions/deploy-pages README의 최소 권한
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  log:
    needs: [build, deploy]
    # 이번 실행에서 새로 승인한 날이 있을 때만 적재한다. 최근 승인일로 적재하면 코드를 push할 때마다 같은 행이 다시 쌓인다(3-9).
    if: needs.build.outputs.confirmed != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      PYTHONIOENCODING: utf-8
      DAYS: ${{ needs.build.outputs.confirmed }}
      PRICE_SHEET_ID: ${{ secrets.PRICE_SHEET_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - if: env.PRICE_SHEET_ID != ''
        run: pip install -r requirements.txt
      # 키 파일을 쓰지 않는다. GitHub OIDC 토큰으로 워크로드 아이덴티티 인증을 받는다.
      - if: env.PRICE_SHEET_ID != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - id: sheet
        name: append approved price changes to the sheet
        if: env.PRICE_SHEET_ID != ''
        continue-on-error: true
        run: |
          for day in $DAYS; do
            if [ -f "data/raw/$day/events.json" ]; then
              python -m publish.sheets_log --events "data/raw/$day/events.json" \
                --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            else
              echo "$day: events.json이 없다(첫 스냅샷). 적재를 건너뛴다."
            fi
          done
      - name: open an issue when the sheet write fails
        if: steps.sheet.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue create --assignee "$OWNER" \
            --title "시트 적재 실패 ($DAYS)" \
            --body "게시는 끝났지만 Google 스프레드시트 적재가 실패했다. 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
