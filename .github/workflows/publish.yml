name: publish
# 사람이 검토 PR을 머지하면(= 컨펌) 승인 기록을 남기고, 대시보드를 GitHub Pages에 올린다.
# 시트 적재는 Secret(GOOGLE_SA_KEY, PRICE_SHEET_ID)이 등록된 뒤에만 실행된다(2-0c).
on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "data/manual/**"
      - "templates/**"
      - "publish/**"
      - "model/**"
      - "pipeline.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    outputs:
      day: ${{ steps.site.outputs.day }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: record approval for merged snapshots
        run: |
          for dir in data/raw/*/; do
            day=$(basename "$dir")
            if [ -f "$dir/review.md" ] && [ ! -f "$dir/approved.txt" ]; then
              echo "confirming $day"
              # 시뮬레이션 스냅샷은 파이프라인이 거부한다. 그때는 건너뛰고 게시는 계속한다.
              python pipeline.py --confirm "$day" || echo "::warning::$day 스냅샷은 반영하지 않았다(시뮬레이션이거나 검토 자료가 불완전하다)."
            fi
          done
          git add data/raw
          if ! git diff --cached --quiet; then
            git commit -m "chore: record approval for merged snapshots"
            git push origin HEAD:main
          fi
      - id: site
        name: build the dashboard
        # 승인일(day)은 pipeline.py가 단계 출력에 직접 쓴다. 출력 문장을 파싱하던 방식은 문장이 바뀌자 조용히 깨졌다.
        run: python pipeline.py --build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  log:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      PYTHONIOENCODING: utf-8
      DAY: ${{ needs.build.outputs.day }}
      PRICE_SHEET_ID: ${{ secrets.PRICE_SHEET_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - if: env.PRICE_SHEET_ID != ''
        run: pip install -r requirements.txt
      # 키 파일을 쓰지 않는다. GitHub OIDC 토큰으로 워크로드 아이덴티티 인증을 받는다.
      - if: env.PRICE_SHEET_ID != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - id: sheet
        name: append approved price changes to the sheet
        if: env.PRICE_SHEET_ID != ''
        continue-on-error: true
        run: |
          if [ -f "data/raw/$DAY/events.json" ]; then
            python -m publish.sheets_log --events "data/raw/$DAY/events.json" \
              --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          else
            echo "events.json이 없다(첫 스냅샷). 적재를 건너뛴다."
          fi
      - name: open an issue when the sheet write fails
        if: steps.sheet.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "시트 적재 실패 ($DAY)" \
            --body "게시는 끝났지만 Google 스프레드시트 적재가 실패했다. 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
