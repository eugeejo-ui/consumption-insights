name: sheets-baseline
# 처음 한 번만 돌린다. 승인 스냅샷의 현재 단가를 기준선으로 시트에 적는다.
# 시트는 사람이 자기 Drive에 만들고 서비스 계정을 편집자로 초대해 둔다.
# 서비스 계정 키는 만들지 않는다. GitHub OIDC 토큰으로 워크로드 아이덴티티 인증을 받는다.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "기준선으로 적을 승인 스냅샷 날짜 (예: 2026-09-11)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PRICE_SHEET_ID: ${{ secrets.PRICE_SHEET_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - env:
          DAY: ${{ inputs.day }}   # 입력값은 식으로 셸에 넣지 않고 환경변수로 넘긴다(보안 점검 2026-09-15)
        run: python -m publish.sheets_log --baseline "$DAY"
