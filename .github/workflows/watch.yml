name: watch
# 가격 확인 알림(Phase 2-6).
# - BigQuery 가격 페이지: 하루 한 번 가격 문자열 지문만 비교한다(Google 약관 허용, robots.txt 준수).
# - Snowflake·Databricks: 약관상 자동 접근하지 않는다. 수동 가격표의 확인일이 오래되면 알림만 만든다.
on:
  schedule:
    - cron: "37 1 * * *"   # 01:37 UTC = 10:37 KST. 수집(00:17 UTC)과 겹치지 않게 둔다
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: check
        run: python -m detect.price_watch --out-dir "$RUNNER_TEMP"
      - name: make sure the labels exist
        run: |
          gh label create price-watch --color BFD4F2 --description "가격 페이지 변경 감지" || true
          gh label create vendor-check --color FEF2C0 --description "수동 가격표 확인 요청" || true
      - name: open an issue when the BigQuery pricing page changed
        if: steps.check.outputs.bigquery_changed == 'true'
        run: |
          if [ -z "$(gh issue list --label price-watch --state open --json number --jq '.[].number')" ]; then
            gh issue create --label price-watch --assignee "$OWNER" \
              --title "BigQuery 가격 페이지가 바뀌었습니다 (${{ steps.check.outputs.day }})" \
              --body-file "$RUNNER_TEMP/bigquery_issue.md"
          else
            echo "이미 열린 price-watch Issue가 있다. 새로 만들지 않는다."
          fi
      - name: remind the manual price tables that went stale
        if: steps.check.outputs.stale_count != '0'
        run: |
          title="수동 가격표 확인 요청 (${{ steps.check.outputs.quarter }})"
          if [ -z "$(gh issue list --label vendor-check --state open --search "$title" --json number --jq '.[].number')" ]; then
            gh issue create --label vendor-check --assignee "$OWNER" --title "$title" --body-file "$RUNNER_TEMP/vendor_reminder.md"
          else
            echo "이번 분기 vendor-check Issue가 이미 있다."
          fi
      - name: keep the fingerprint in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/bigquery_pricing_fingerprint.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update the BigQuery pricing fingerprint"
            git push origin HEAD:main
          fi
